services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "${PORT:-8080}"
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aiswitch}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-aiswitch-dev-secret-change-in-production}"
      CARD_CODE_PEPPER: "${CARD_CODE_PEPPER:-aiswitch-dev-secret-change-in-production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:1420,tauri://localhost,https://tauri.localhost}"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aiswitch}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
