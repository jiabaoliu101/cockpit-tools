# 1Panel / OpenResty site configuration for admin.clawbotchat.com.
# Place the built static files in /opt/aiswitch/admin-web/.

root /opt/aiswitch/admin-web;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

# The management API stays behind the existing AISwitch API path.
# Browser authentication is enforced again by the Go API's AdminRequired middleware.
